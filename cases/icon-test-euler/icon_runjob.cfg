#!/usr/bin/env bash
#SBATCH --job-name=icon
#SBATCH --time={cfg.walltime_icon}
#SBATCH --ntasks={cfg.icon_np_tot}
#SBATCH --constraint={cfg.constraint}
#SBATCH --output={cfg.logfile}
#SBATCH --open-mode=append
#SBATCH --chdir={cfg.icon_work}

set +x
ulimit -s unlimited

# OpenMP environment variables
export OMP_NUM_THREADS=1
export ICON_THREADS=1
export OMP_SCHEDULE=static
export OMP_DYNAMIC="false"
export OMP_STACKSIZE=200M

# ----------------------------------------------------------------------------
# ICON master namelist
# ----------------------------------------------------------------------------
cat > icon_master.namelist << EOF
&master_nml
 lrestart                   = {cfg.lrestart}
 read_restart_namelists     = .true.
/
&master_time_control_nml
 calendar                    = 'proleptic gregorian'
 restartTimeIntval           = '{cfg.restart_step}'
 checkpointTimeIntval        = '{cfg.restart_step}'
 experimentStartDate         = '{cfg.ini_datetime_string}'
 experimentStopDate          = '{cfg.end_datetime_string}'
/
&master_model_nml
 model_type                  = 1
 model_name                  = "ATMO"
 model_namelist_filename     = "NAMELIST_{cfg.casename}"
 model_min_rank              = 1
 model_max_rank              = 65536
 model_inc_rank              = 1
/
EOF
# ----------------------------------------------------------------------------
# Model namelist
# ----------------------------------------------------------------------------
cat > NAMELIST_{cfg.casename} << EOF
&parallel_nml
 nproma                      = 128
 p_test_run                  = .FALSE.
 num_io_procs                = {cfg.icon_np_io}
 num_restart_procs           = {cfg.icon_np_restart}
 num_prefetch_proc           = {cfg.icon_np_prefetch}   ! must be 0 for global IC-only
 iorder_sendrecv             = 3
/
&run_nml
 ltestcase                   = .FALSE.
 num_lev                     = 60
 lvert_nest                  = .FALSE.
 dtime                       = 60.
 ldynamics                   = .TRUE.
 ltransport                  = .TRUE.
 ntracer                     = 0
 iforcing                    = 3
 msg_level                   = 13
 ltimer                      = .TRUE.
 timers_level                = 10
 check_uuid_gracefully       = .TRUE.
 output                      = "nml"
 lart                        = .FALSE.
 debug_check_level           = 10
 restart_filename            = "{cfg.icon_restart_out}/{cfg.output_filename}_<rsttime>.nc"
 activate_sync_timers        = .TRUE.
/
&dynamics_nml
 iequations                  = 3
 divavg_cntrwgt              = 0.50
 lcoriolis                   = .TRUE.
/
&extpar_nml
 itopo                       = 1
 extpar_filename             = '{cfg.input_files_scratch_extpar_filename}'
 n_iter_smooth_topo          = 1,1
 heightdiff_threshold        = 3000.
 hgtdiff_max_smooth_topo     = 750.,750.
/
&initicon_nml
 init_mode                   = 2
 lread_ana                   = .FALSE.
 ifs2icon_filename           = "{inidata_filename}"     ! produced by era5_ic job
 ana_varnames_map_file       = "{cfg.input_files_scratch_map_file_ana}"
 ltile_coldstart             = .TRUE.
 ltile_init                  = .FALSE.
/
&grid_nml
 dynamics_grid_filename      = "{cfg.input_files_scratch_dynamics_grid_filename}"
 dynamics_parent_grid_id     = 0
 lredgrid_phys               = .FALSE.                  ! radiation on the dynamics grid
 l_limited_area              = .FALSE.                  ! IMPORTANT: global mode
/
&io_nml
 itype_pres_msl              = 5
 itype_rh                    = 1
 restart_file_type           = 5
/
&nwp_phy_nml
 inwp_gscp                   = 2
 inwp_convection             = 1
 inwp_radiation              = 4
 inwp_cldcover               = 1
 inwp_turb                   = 1
 inwp_satad                  = 1
 inwp_sso                    = 1
 inwp_gwd                    = 0
 inwp_surface                = 1
 latm_above_top              = .TRUE.
 efdt_min_raylfric           = 7200.
 itype_z0                    = 2
 lrtm_filename               = '{cfg.input_files_scratch_lrtm_filename}'
 cldopt_filename             = '{cfg.input_files_scratch_cldopt_filename}'
 dt_rad                      = 720.
 dt_conv                     = 120.
 dt_sso                      = 120.
 dt_gwd                      = 360.
/
&output_nml
 filetype                    = 4
 dom                         = 1
 output_bounds               = 0., 10000000., 3600.
 steps_per_file              = 1
 mode                        = 1
 include_last                = .TRUE.
 output_filename             = '{cfg.output_filename}'
 filename_format             = '{cfg.icon_output}/<output_filename>_DOM<physdom>_<ddhhmmss>'
 output_grid                 = .TRUE.
 remap                       = 1
 reg_lon_def                 = -179.5,1.0,179.5
 reg_lat_def                 = 89.5,-1.0,-89.5
/
EOF

# ----------------------------------------------------------------------------
# Run ICON
# ----------------------------------------------------------------------------
# Match the environment the provided ICON executable was built against
source {cfg.chain_src_dir}/machines/euler/modules.sh
set -x
srun -n {cfg.icon_np_tot} ./{cfg.icon_execname}
rc=$?
set +x
exit $rc
