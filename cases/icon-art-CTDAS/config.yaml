# Configuration file for the 'icon-art-CTDAS' case with ICON

# From the `icon-wcp` environment:
# - spack install nco@4.9.0
# - spack install icontools@c2sm-master%gcc
# - spack install cdo

workflow: icon
constraint: gpu
run_on: cpu
compute_queue: normal
nodes: 2
ntasks_per_node: 4
startdate: 2018-01-01T00:00:00Z
enddate: 2018-12-31T23:59:59Z
restart_step: PT10D # = CTDAS cycle length

####### Tracer options
# The tracers XML file will be generated on-the-fly
tracers:
    TRCO2_A:
        oem_cat: "A-CO2, B-CO2, C-CO2, D-CO2, E-CO2, F1-CO2, F2-CO2, F3-CO2, F4-CO2, G-CO2, H-CO2, I-CO2, J-CO2, K-CO2, L-CO2"
        oem_vp:  "A-CO2, B-CO2, C-CO2, D-CO2, E-CO2, F1-CO2, F2-CO2, F3-CO2, F4-CO2, G-CO2, H-CO2, I-CO2, J-CO2, K-CO2, L-CO2"
        oem_tp:  "A-CO2, B-CO2, C-CO2, D-CO2, E-CO2, F1-CO2, F2-CO2, F3-CO2, F4-CO2, G-CO2, H-CO2, I-CO2, J-CO2, K-CO2, L-CO2"
    TRCO2_BG:
        init_name: "CO2"
    CO2_RA:
        oem_ftype: "resp"
    CO2_GPP:
        oem_ftype: "gpp"
    TRCO2_A-XXX:
        bg: "TRCO2_BG"
        ra: "CO2_RA"
        gpp: "CO2_GPP"
    biosource:
        oem_cat: "GFAS1, GFAS2, GFAS3, GFAS4, GFAS5, GFAS6, GFAS7, GFAS8, GFAS9, GFAS10, allcropsource, allwoodsource, lakeriveremis, cflx"
        oem_vp:  "L-CO2, L-CO2, L-CO2, L-CO2, L-CO2, L-CO2, L-CO2, L-CO2, L-CO2, L-CO2,   L-CO2,         L-CO2,         L-CO2,         L-CO2"
        oem_tp:  "GFAS1, GFAS2, GFAS3, GFAS4, GFAS5, GFAS6, GFAS7, GFAS8, GFAS9, GFAS10,  L-CO2,         L-CO2,         L-CO2,         L-CO2"
    biosink:
        oem_cat: "biofuelcropsource, biofuelwoodsource, mflx"
        oem_vp:  "L-CO2,             L-CO2,             L-CO2"
        oem_tp:  "L-CO2,             L-CO2,             L-CO2"
    EM_TRCO2_A:
        oem_cat: "A-CO2, B-CO2, C-CO2, D-CO2, E-CO2, F1-CO2, F2-CO2, F3-CO2, F4-CO2, G-CO2, H-CO2, I-CO2, J-CO2, K-CO2, L-CO2"
        oem_vp:  "A-CO2, B-CO2, C-CO2, D-CO2, E-CO2, F1-CO2, F2-CO2, F3-CO2, F4-CO2, G-CO2, H-CO2, I-CO2, J-CO2, K-CO2, L-CO2"
        oem_tp:  "A-CO2, B-CO2, C-CO2, D-CO2, E-CO2, F1-CO2, F2-CO2, F3-CO2, F4-CO2, G-CO2, H-CO2, I-CO2, J-CO2, K-CO2, L-CO2"
    EM_CO2_RA:
        oem_ftype: "resp"
    EM_CO2_GPP:
        oem_ftype: "gpp"
####### CTDAS options.
# First of all, do the following in your ~ (home) folder, e.g.,
# git clone -b ctdas-icon https://git.wur.nl/ctdas/CTDAS.git ~/ctdas-icon
# We will PATCH that code
# Execute `start_ctdas_icon.sh $SCRATCH ctdas_procchain`
# which will put the CTDAS files into $SCRATCH/ctdas_procchain.
# We will then 'patch' this CTDAS installation with the required files,
# - ctdas-icon.py [which runs CTDAS; and imports the following patched classes]:
    # - statevector class [which, ultimately, defines our ensemble members]
    # - observation operator (obsoperator) class [which, ultimately, runs the ICON scripts & post-processing sampler]
    # - observations class [which, ultimately, defines how to ingest the observations]
    # - optimizer class [which, ultimately, defines how to do localization]
# - rc-cteco2 file [which, ultimately, is how we pass general input like folder names etc to CTDAS]
# - rc-job file [which, ultimately, is the setup for CTDAS like lag times, etc.]
CTDAS:
    runthrough: True # If true, this makes the 'CTDAS' job run (1) CTDAS but also (2) a simulation for the full year without the ensemble members but with n_boundaries BG tracers
    nlag: 2
    tracer: co2
    regions: basegrid # choose: basegrid or parentgrid
    nensembles: 186
    # nregions: # read from cells->regions file
    restart_init_time: 86400 # 1 day in seconds; using Michael Steiner's "overwriting" restart mechanism
    ctdas_cycle: 10 # days
    ctdas_nlag: 2
    nboundaries: 8
    propagate_bg: True # If true, an additional ensemble member is created which just holds the background tracer
    lambdas: # The first 16 lambdas must be the respiration and uptake ones [even if not relevant, e.g., for a CH4 simulation], followed by the oem_cat categories in the xml file, in order of appearance, but excluding any 
        - 1,1,1,1,1,1,1,1 # Respiration (Evergreen Forest, Deciduous Forest, Mixed Forest, Shrubland, Savanna, Cropland, Grassland, Urban/Other)
        - 1,1,1,1,1,1,1,1 # Uptake (E, D, M, S, SV, C, G, U)
        - 2,2,2,2,2,2,2,2,2,2,2,2,2,2,2 # Anthropogenic CO2 (ensemble tracer categories that are optimized)
    obs:
        # Run the 'authentification.ipynb' notebook to get access to ICOS and/or NASA Earthdata (OCO2) data
        ICOS:
            fetch: False
            path: /capstor/scratch/cscs/ekoene/ICOS/
