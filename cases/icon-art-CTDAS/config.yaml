        da/platform: ctdas_patch/santis.py
        da/rc/cteco2: ctdas_patch/carbontracker_icon_oco2.rc
        da/tools/icon:
            - ctdas_patch/utilities.py
            - ctdas_patch/icon_helper.py
            - ctdas_patch/icon_sampler.py
    covariancematrix_definition: |
            Corr = np.array([[1,   0], # VPRM has a 100% error (remember, lambda VPRM=1 as set above)
                             [0, 0.5]]) # Anthropogenic has a 50% error (remember, lambda Anth=2 as set above)
            specific_length_bio = 300 # km
            specific_length_anth = 200 # km
            exp_factors_anth = np.exp(-distances / specific_length_anth)
            exp_factors_bio = np.exp(-distances / specific_length_bio)

            for ix, _ in enumerate(distances):
                for ic in range(Corr.shape[0]):
                    for ik in range(Corr.shape[1]):
                        idx = ix * categories + ic
                        exp_factor = exp_factors_anth[ix] if ic == 1 or ik == 1 else exp_factors_bio[ix]
                        covariancematrix[idx, ik:-n_bg_params:categories] = exp_factor * Corr[ic, ik]

            #set variances for the 8 background elements
            if n_bg_params>0:
                for iii in np.arange(n_bg_params):
                    covariancematrix[-n_bg_params + iii                    , -n_bg_params + iii] = 0.015 * 0.015  # 0.015 * 400 = 6 ppm stdev
                    covariancematrix[-n_bg_params + (iii + 1) % n_bg_params, -n_bg_params + iii] = 0.015 * 0.015 * 0.25 # Neighbouring entries
                    covariancematrix[-n_bg_params + (iii - 1) % n_bg_params, -n_bg_params + iii] = 0.015 * 0.015 * 0.25 # Neighbouring entries
    job_time: 10:00:00

