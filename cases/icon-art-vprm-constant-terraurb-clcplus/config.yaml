    - copy_icbc.cfg

input_files:
    radiation_grid_filename: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/grid_input/switzerland/icon_switzerland_R19B9_DOM01.parent.nc
    dynamics_grid_filename: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/grid_input/switzerland/icon_switzerland_R19B9_DOM01.nc
    map_file_latbc: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/grid_input/map_file_ZH.latbc
    lateral_boundary_grid: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/icbc_input/triangular-grid-lbc.nc
    lrtm_filename: /store/c2sm/amrs/kdnmez/icon-nwp-new/data/rrtmg_lw.nc
    map_file_ana: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/grid_input/map_file.ana
    chemtracer_xml_filename: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/xml/updated_summer23.xml
    oem_gridded_emissions_nc: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/oae/oem_gridded_emissions.nc
    oem_vertical_profiles_nc: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/oae/vertical_profiles.nc
    oem_hourofday_nc: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/oae/hourofday.nc
    oem_dayofweek_nc: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/oae/dayofweek.nc
    oem_monthofyear_nc: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/oae/monthofyear.nc
    extpar_filename: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/extpar/extpar_output_switzerland_clcplus_UrbaNature_modify_extpar.nc
