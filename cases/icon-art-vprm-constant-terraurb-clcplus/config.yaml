# Configuration file for the 'icon-art-terraurb-test' case with ICON

workflow: icon-art-vprm-constant-terraurb-clcplus
constraint: mc
run_on: cpu
compute_queue: debug
ntasks_per_node: 128
startdate: 2023-07-01T00:00:00Z
enddate: 2023-08-31T23:00:00Z
restart_step: PT166H
lterra_urb: .TRUE.
lurbalb: .TRUE.
lurbahf: .TRUE.

walltime:
    prepare_icon: '00:30:00'
    oem: '00:30:00'
    icon: '00:30:00'


eccodes_dir: /store/c2sm/amrs/kdnmez/eccodes_definitions
iconremap_bin: iconremap
iconsub_bin: iconsub
latbc_filename: ICON-ART-UNSTRUCTURED_DOM01_<y><m><d>T<h>0000Z_lbc.nc
latbc_copy_path: /store/c2sm/amrs/kdnmez/UrbaNature/icon_art_run/input/icbc_input/new_EU_runs/remapped_bc/*_lbc.nc
inidata_prefix: ICON-ART-UNSTRUCTURED_DOM01_
inidata_nameformat: '<y><m><d>T<h>0000Z'
inidata_filename_suffix: .nc
inicond_filename: /store/c2sm/amrs/kdnmez/UrbaNature/icon_terra_urb_run/input/icbc_input/remapped/ICON-ART-UNSTRUCTURED_DOM01_20230701T000000Z.nc
output_filename: ICON-NWP-URBANATURE-UNSTRUCTURED
filename_format: <output_filename>_DOM<physdom>_<datetime2>
lateral_boundary_grid_order: lateral_boundary
art_input_folder: /store/c2sm/amrs/kdnmez/icon-nwp-new/externals/art
