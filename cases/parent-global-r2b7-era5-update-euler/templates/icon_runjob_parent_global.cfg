#!/usr/bin/env bash
#SBATCH --job-name=icon_parent_global_np{cfg.icon_np_tot}
#SBATCH --time={cfg.walltime_icon}
#SBATCH --ntasks={cfg.icon_np_tot}
#SBATCH --constraint={cfg.constraint}
#SBATCH --partition={cfg.compute_queue}
#SBATCH --output=slurm-%x-%j.out
#SBATCH --chdir={cfg.icon_work}
#SBATCH --ntasks-per-node={cfg.ntasks_per_node}
#SBATCH --hint=nomultithread
#SBATCH --cpus-per-task=1
#SBATCH --open-mode=append
#SBATCH --mem-per-cpu=1800



set -euo pipefail
ulimit -s unlimited

export OMP_NUM_THREADS=1
export ICON_THREADS=1
export OMP_SCHEDULE=static
export OMP_DYNAMIC="false"
export OMP_STACKSIZE=200M



# -----------------------------------------------------------------------------
# Read varlists (brace-free, safe with Python .format templates)
# -----------------------------------------------------------------------------
PARENT_EVAL_SFC_VARS="$(grep -v -E '^\s*($|#)' "{cfg.case_path}/varlists/parent_eval_hourly_sfc.txt" \
  | sed -e 's/\r$//' -e "s/.*/'&'/" | paste -sd, -)"

PARENT_EVAL_PL_VARS="$(grep -v -E '^\s*($|#)' "{cfg.case_path}/varlists/parent_eval_hourly_pl.txt" \
  | sed -e 's/\r$//' -e "s/.*/'&'/" | paste -sd, -)"

PARENT_NATIVE_3D_VARS="$(grep -v -E '^\s*($|#)' "{cfg.case_path}/varlists/parent_native_3d_1D_ml.txt" \
  | sed -e 's/\r$//' -e "s/.*/'&'/" | paste -sd, -)"

# -----------------------------------------------------------------------------
# Stage required radiation/aerosol/ozone datasets (brace-free)
# -----------------------------------------------------------------------------
ECRAD="{cfg.ecrad_data_path}"
ICONDATA="{cfg.icon_data_path}"
YEAR="{cfg.start_year}"

test -e "$ECRAD/bc_aeropt_kinne_sw_b14_coa.nc" || exit 2
ln -sf "$ECRAD/bc_aeropt_kinne_sw_b14_coa.nc" bc_aeropt_kinne_sw_b14_coa.nc

test -e "$ECRAD/bc_aeropt_kinne_lw_b16_coa.nc" || exit 2
ln -sf "$ECRAD/bc_aeropt_kinne_lw_b16_coa.nc" bc_aeropt_kinne_lw_b16_coa.nc

test -e "$ECRAD/bc_aeropt_kinne_sw_b14_fin_${{YEAR}}.nc" || exit 2
ln -sf "$ECRAD/bc_aeropt_kinne_sw_b14_fin_${{YEAR}}.nc" bc_aeropt_kinne_sw_b14_fin.nc

test -e "$ECRAD/bc_aeropt_cmip6_volc_lw_b16_sw_b14_${{YEAR}}.nc" || exit 2
ln -sf "$ECRAD/bc_aeropt_cmip6_volc_lw_b16_sw_b14_${{YEAR}}.nc" bc_aeropt_cmip6_volc_lw_b16_sw_b14_${{YEAR}}.nc

test -e "$ICONDATA/MACv2.0-SP_v1.nc" || exit 2
ln -sf "$ICONDATA/MACv2.0-SP_v1.nc" MACv2.0-SP_v1.nc

test -e "$ECRAD/bc_ozone_ssp370_${{YEAR}}.nc" || exit 2
ln -sf "$ECRAD/bc_ozone_ssp370_${{YEAR}}.nc" bc_ozone_${{YEAR}}.nc



# -----------------------------------------------------------------------------
# ICON master namelist
# -----------------------------------------------------------------------------
cat > icon_master.namelist << EOF
&master_nml
  lrestart               = {cfg.lrestart}
  read_restart_namelists = .true.
/

&master_time_control_nml
  calendar              = 'proleptic gregorian'
  experimentStartDate   = '{cfg.ini_datetime_string}'
  experimentStopDate    = '{cfg.end_datetime_string}'
  restartTimeIntval     = '{cfg.restart_step}'
  checkpointTimeIntval  = '{cfg.restart_step}'
/

&master_model_nml
  model_type              = 1
  model_name              = "ATMO"
  model_namelist_filename = "NAMELIST_{cfg.casename}"
  model_min_rank          = 1
  model_max_rank          = 65536
  model_inc_rank          = 1
/
EOF

# -----------------------------------------------------------------------------
# Model namelist (ATMO)
# -----------------------------------------------------------------------------
cat > NAMELIST_{cfg.casename} << EOF

&parallel_nml
  nproma            = 128
  ! nblocks_e         = 0
  l_log_checks      = .FALSE.
  num_io_procs      = {cfg.icon_np_io}
  num_restart_procs = {cfg.icon_np_restart}
  iorder_sendrecv   = 3
/

&grid_nml
  dynamics_grid_filename       = "{cfg.input_files_scratch_dynamics_grid_filename}"
  radiation_grid_filename      = "{cfg.input_files_scratch_radiation_grid_filename}"
  dynamics_parent_grid_id      = 0
  lredgrid_phys                = .TRUE.
  l_limited_area               = .FALSE.
  lfeedback                    = .FALSE.
/

&initicon_nml
  init_mode                    = 2
  lread_ana                    = .FALSE.
  ifs2icon_filename            = "{inidata_filename}"
  ana_varnames_map_file        = "{cfg.input_files_scratch_map_file_ana}"
  zpbl1                        = 500.
  zpbl2                        = 1000.
  ltile_init                   = .TRUE.
  ltile_coldstart              = .TRUE.
/

&run_nml
  modelTimeStep                = "PT120S"
  num_lev                      = 120
  lvert_nest                   = .FALSE.
  ldynamics                    = .TRUE.
  ltransport                   = .TRUE.
  iforcing                     = 3
  lart                         = .FALSE.
  ltestcase                    = .FALSE.
  msg_level                    = 10
  ltimer                       = .TRUE.
  activate_sync_timers         = .TRUE.
  timers_level                 = 10
  output                       = "nml"
  check_uuid_gracefully        = .TRUE.
  restart_filename             = "{cfg.icon_restart_out}/{cfg.output_filename}_<rsttime>.nc"
/

&io_nml
  itype_pres_msl               = 5
  itype_rh                     = 1
  restart_file_type            = 5
  restart_write_mode           = "joint procs multifile"
  lflux_avg                    = .TRUE.
  lnetcdf_flt64_output         = .FALSE.
  precip_interval              = "PT1H"
  runoff_interval              = "PT3H"
  maxt_interval                = "PT3H"
  melt_interval                = "PT3H"
  lmask_boundary               = .FALSE.
/

&extpar_nml
  extpar_filename              = "{cfg.input_files_scratch_extpar_filename}"
  itopo                        = 1
  n_iter_smooth_topo           = 1
  heightdiff_threshold         = 3000.
  hgtdiff_max_smooth_topo      = 750.
  itype_vegetation_cycle       = 3
  itype_lwemiss                = 2
/

&nwp_phy_nml
  inwp_gscp                    = 2
  inwp_convection              = 1
  lshallowconv_only            = .FALSE.
  inwp_radiation               = 4
  inwp_cldcover                = 1
  inwp_turb                    = 1
  inwp_satad                   = 1
  inwp_sso                     = 1
  inwp_gwd                     = 1
  inwp_surface                 = 1
  icapdcycl                    = 3
  itype_z0                     = 2

  ! cadence consistent with modelTimeStep=PT120S
  dt_conv                      = 120
  dt_sso                       = 120
  dt_gwd                       = 120
  dt_ccov                      = 120
  dt_rad                       = 600

  latm_above_top               = .FALSE.
  efdt_min_raylfric            = 7200.0
  icpl_aero_conv               = 0
  icpl_aero_gscp               = 0
  ldetrain_conv_prec           = .FALSE.

  lrtm_filename                = "{cfg.input_files_scratch_lrtm_filename}"
  cldopt_filename              = "{cfg.input_files_scratch_cldopt_filename}"
/

&radiation_nml
  ecrad_isolver                = 0
  irad_o3                      = 5
  irad_o2                      = 2           ! Tracer variable (CLM commnity)
  irad_cfc11                   = 2           ! Tracer variableTracer variable (co2, ch4,n20,o2,cfc11,cfc12))
  irad_cfc12                   = 2           ! Tracer Variable (cfc12)
  irad_aero                    = 18 ! was 18, change back if we get file
  albedo_type                  = 2
  direct_albedo                = 4
  albedo_whitecap              = 1
  vmr_co2                      = 390.e-06
  vmr_ch4                      = 1800.e-09
  vmr_n2o                      = 322.0e-09
  vmr_o2                       = 0.20946
  vmr_cfc11                    = 240.e-12
  vmr_cfc12                    = 532.e-12
  ecrad_data_path              = "{cfg.ecrad_data_path}"
/

&nonhydrostatic_nml
  iadv_rhotheta                = 2
  ivctype                      = 2
  itime_scheme                 = 4
  exner_expol                  = 0.333
  vwind_offctr                 = 0.2
  damp_height                  = 30000.
  rayleigh_coeff               = 0.5
  divdamp_order                = 24
  divdamp_type                 = 32
  divdamp_fac                  = 0.004
  divdamp_trans_start          = 12500.
  divdamp_trans_end            = 17500.
  igradp_method                = 3
  l_zdiffu_t                   = .TRUE.
  thslp_zdiffu                 = 0.02
  thhgtd_zdiffu                = 125.
  htop_moist_proc              = 22500.
  hbot_qvsubstep               = 16000.
  ndyn_substeps                = 5
/

&sleve_nml
  min_lay_thckn                = 50.
  htop_thcknlimit              = 15000.
  top_height                   = 85000.
  stretch_fac                  = 0.9
  decay_scale_1                = 4000.
  decay_scale_2                = 2500.
  decay_exp                    = 1.2
  flat_height                  = 25000.
/

&dynamics_nml
  iequations                   = 3
  divavg_cntrwgt               = 0.50
  lcoriolis                    = .TRUE.
/

&transport_nml
  ihadv_tracer                 = 2,2,2,2,2,2
  itype_hlimit                 = 4,4,4,4,4,4
  ivadv_tracer                 = 3,3,3,3,3,3
  itype_vlimit                 = 1,1,1,1,1,1
  ivlimit_selective            = 1,1,1,1,1,1
  llsq_svd                     = .TRUE.
/

&diffusion_nml
  hdiff_order                  = 5
  itype_vn_diffu               = 1
  itype_t_diffu                = 2
  hdiff_efdt_ratio             = 32.0
  hdiff_smag_fac               = 0.025
  lhdiff_vn                    = .TRUE.
  lhdiff_temp                  = .TRUE.
/

&turbdiff_nml
  tkhmin                       = 0.6
  tkhmin_strat                 = 1.0
  tkmmin                       = 0.75
  pat_len                      = 750.
  c_diff                       = 0.2
  rlam_heat                    = 10.0
  rat_sea                      = 0.8
  ltkesso                      = .TRUE.
  frcsmot                      = 0.2
  imode_frcsmot                = 2
  alpha1                       = 0.125
  icldm_turb                   = 1
  itype_sher                   = 1
  ltkeshs                      = .TRUE.
  a_hshr                       = 2.0
/

&lnd_nml
  sstice_mode                  = 1 ! update sst and ice at intervals is mode 6
  ntiles                       = 3
  nlev_snow                    = 1
  zml_soil                     = 0.005,0.02,0.06,0.18,0.54,1.62,4.86,14.58
  lmulti_snow                  = .FALSE.
  itype_heatcond               = 3
  idiag_snowfrac                = 20
  itype_snowevap                = 3
  lsnowtile                    = .TRUE.
  lseaice                      = .TRUE.
  llake                        = .TRUE.
  itype_lndtbl                  = 4
  itype_evsl                    = 4
  itype_trvg                    = 3
  itype_root                    = 2
  itype_canopy                  = 2
  cwimax_ml                    = 5.e-4
  c_soil                       = 1.25
  c_soil_urb                   = 0.5
  lprog_albsi                  = .TRUE.
/

! ============================================================
! OUTPUT STREAM 1a: hourly eval (remapped) - MODEL LEVELS
! ============================================================
&output_nml
  filetype        = 5
  dom             = 1
  steps_per_file  = 1
  include_last    = .TRUE.

  output_filename = '{cfg.output_filename}_eval_hourly_sfc'
  filename_format = '{cfg.icon_output}/{cfg.output_filename}_eval_hourly_sfc_DOM<physdom>_<datetime2>'

  output_bounds   = 0., 1.0e15, 3600.

  remap           = 1
  reg_lon_def     = {cfg.parent_eval_reg_lon_def}
  reg_lat_def     = {cfg.parent_eval_reg_lat_def}

  ml_varlist      = ${{PARENT_EVAL_SFC_VARS}}
/

! ============================================================
! OUTPUT STREAM 1b: hourly eval (remapped) - PRESSURE LEVELS
! ============================================================
&output_nml
  filetype        = 5
  dom             = 1
  steps_per_file  = 1
  include_last    = .FALSE. ! back to true in actual runs

  output_filename = '{cfg.output_filename}_eval_hourly_pl'
  filename_format = '{cfg.icon_output}/{cfg.output_filename}_eval_hourly_pl_DOM<physdom>_<datetime2>'

  output_bounds   = 0., 1.0e15, 86400. ! longer interval than run, no output 

  remap           = 1
  reg_lon_def     = {cfg.parent_eval_reg_lon_def}
  reg_lat_def     = {cfg.parent_eval_reg_lat_def}

  p_levels        = {cfg.parent_eval_p_levels_pa}
  pl_varlist      = ${{PARENT_EVAL_PL_VARS}}
/

! ============================================================
! OUTPUT STREAM 2: daily native 3D (ICON grid)
! ============================================================
&output_nml
  filetype        = 5
  dom             = 1
  steps_per_file  = 1
  include_last    = .FALSE.

  output_filename = '{cfg.output_filename}_native_3d_1D'
  filename_format = '{cfg.icon_output}/{cfg.output_filename}_native_3d_1D_DOM<physdom>_<datetime2>'

  output_bounds   = 0., 1.0e15, 86400.
  remap           = 0

  ml_varlist      = ${{PARENT_NATIVE_3D_VARS}}
/
EOF

# -----------------------------------------------------------------------------
# Run ICON
# -----------------------------------------------------------------------------
if [[ -f {cfg.chain_src_dir}/ext/icon/modules.env ]]; then
    source {cfg.chain_src_dir}/ext/icon/modules.env
else
    echo "Warning: ext/icon/modules.env not found, falling back to the machine modules" >&2
    source {cfg.chain_src_dir}/machines/euler/modules.sh
fi
set -x
srun -n {cfg.icon_np_tot} ./{cfg.icon_execname}
set +x
