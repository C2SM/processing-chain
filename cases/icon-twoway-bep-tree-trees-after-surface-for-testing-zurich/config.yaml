# Configuration file for the 'icon-twoway-bep-tree-trees-after-surface-for-testing-zurich' case with ICON

workflow: icon-twoway-bep-tree-trees-after-surface-for-testing-zurich
run_on: cpu
compute_queue: normal
compute_account: em05-0
ntasks_per_node: 128
startdate: 2026-05-23T00:00:00Z
enddate: 2026-07-01T00:00:00Z
# FULL PRODUCTION WINDOW (extended 2026-08-26 from the 216h/9-day spin-up-only
# window), matching icon-standard-zurich: 936h = 39 days, 23 May - 1 Jul, i.e.
# spin-up + all of June, so 30 June is simulated in full. ICBC for this whole
# range is already generated and verified (heatwave2026/icbc, 937 files, ALL
# CHECKS PASSED); lbc/ic on store cover 23 May - 31 Jul, checked 2026-08-26.
# restart_step must always equal enddate-startdate exactly, or config.py's
# get_chunk_list() silently drops the only chunk (chain exits immediately,
# nothing submitted, no error) - see icon-standard-zurich/config.yaml for the
# full note. restart_step = the whole window: one chunk, no restart chaining,
# matching how these cases are always run.
restart_step: PT936H
lterra_urb: .FALSE.
lurbalb: .FALSE.
lurbahf: .FALSE.

walltime:
    prepare_icon: '00:30:00'
    oem: '00:30:00'
    # Measured: 216h/9 days took ~35 min on 5 nodes - the BEP-Tree ComIn
    # plugin makes this run ~1.75x the cost of icon-standard/icon-terraurb,
    # hence a separate budget. 35 x 39/9 = ~152 min for the 936h window;
    # 5:00:00 is ~2.0x that. Single chunk, so a walltime kill costs all
    # 39 days - err generous. 'normal' allows up to 24h.
    icon: '07:00:00'

eccodes_dir: /capstor/store/cscs/c2sm/amrs/kdnmez/eccodes_definitions
iconremap_bin: iconremap
iconsub_bin: iconsub
# ICBC now comes from icon_icbc_prep (CDO-based, replaces the old
# iconremap/ncks pipeline) - see /capstor/scratch/cscs/kdnmez/heatwave2026/.
# latbc_copy_path/inicond_filename feed prepare_icon.py's "extras for kutay's
# version" cp step; latbc_filename/dwdfg_filename must match what actually
# lands in cfg.icon_input_icbc after that copy - both point at the
# calendar-dated names (lbc_<date>.nc / ic_<date>.nc), not the DWD
# lead-time names (ilbff.../igfff...), since ICON's <y><m><d><h> templating
# in latbc_filename needs one file per real timestamp.
latbc_filename: lbc_<y><m><d><h>.nc
# Moved off scratch to durable store 2026-08-17: heatwave2026/icbc/ on
# /capstor/scratch is subject to purge, this copy on /capstor/store isn't.
# rsync -H preserved the hard-link structure (ic_<date>.nc/lbc_<date>.nc are
# still hard links to igfff.../ilbff..., not separate copies - matters for
# downstream cp -rf, see icon_icbc_prep/README.md gotcha #13). 1680 files
# now available (23 May - 31 Jul); the broad glob matches all of them, only
# this case's own window (see startdate/enddate above) actually gets used -
# harmless once-off extra copy, not a correctness issue.
latbc_copy_path: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/icbc_input/zurich_larger/remapped/lbc/lbc_2026*.nc
inidata_prefix: ic_
inidata_nameformat: '<y><m><d><h>'
inidata_filename_suffix: .nc
inicond_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/icbc_input/zurich_larger/remapped/ic/ic_2026052300.nc
output_filename: ICON-NWP-URBANATURE-UNSTRUCTURED
filename_format: <output_filename>_DOM<physdom>_<datetime2>
lateral_boundary_grid_order: lateral_boundary
dwdfg_filename: ic_2026052300.nc

icontools_runjobs:
    - copy_icbc.cfg

# Domain enlarged to zurich_larger (2026-08-31). This IS a real domain
# change, unlike the 2026-08-17 zurich_small rename which only re-pointed
# paths at the identical physical grid:
#
#   zurich_small    7704 cells, lon 8.207..8.833, lat 47.189..47.611  47x47 km
#   zurich_larger  29928 cells, lon 7.907..9.133, lat 46.989..47.811  92x91 km
#
# Same ~575 m mesh - 3.9x the cells buys area, not resolution. Zurich
# (8.54, 47.38) now sits ~45 km from the nearest lateral boundary instead of
# ~22 km.
#
# Why: every run on zurich_small blew up at model time 2026-06-01 04:15 and
# wrote NaN for the remaining 716 of 937 output steps. The runaway was 41
# grid points at lon 8.74..8.81 - 1.7 to 7.0 km inside the eastern edge,
# straddling the inner boundary of the 10-cell (5.7 km) nudging zone - while
# a strengthening upper-level jet exited through it. Vertical velocity there
# grew from the usual ~5 m/s (boundary layer) to 80 m/s at 8.1 km, which is
# exactly vertical CFL = 1 for dz=399 m at dtime=5 s, and went nonlinear
# within 25 s. Plain ICON blew up identically to the urban runs, so it was
# not the urban physics; the driving ICBC was verified clean (no NaN, smooth
# in time, W < 3 m/s at that spot). Moving the boundary further from the
# area of interest is the structural fix.
#
# NOTE: np_tot and walltime below are UNCHANGED and are sized for the old
# 7704-cell domain. At 3.9x the cells they will not be enough - set them
# before submitting.
input_files:
    radiation_grid_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_larger/zonda_output_zurich_larger/data/DOM01/zurich_larger_DOM01.parent.nc
    dynamics_grid_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_larger/zonda_output_zurich_larger/data/DOM01/zurich_larger_DOM01.nc
    map_file_latbc: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/map_file_ZH.latbc
    lateral_boundary_grid: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_larger/zonda_output_zurich_larger/data/DOM01/zurich_larger_DOM01_latbc.grid.nc
    lrtm_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/icon-nwp-new/data/rrtmg_lw.nc
    map_file_ana: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/map_file.ana
    chemtracer_xml_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/xml/updated_summer23.xml
    extpar_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_larger/zonda_output_zurich_larger/data/DOM01/zurich_larger_DOM01_external_parameter.nc

# the right extpar data to use for clcplus is: spatially_varying_extpar_final_output_CLCplus_UrbaNature.nc both for spatially varying and constant cases.

icon:
    binary_file: /capstor/store/cscs/c2sm/amrs/kdnmez/spack/opt/spack/linux-sles15-zen2/gcc-13.3.0/icon-icon-2026.04-dwd-1.9-iixu6iy4vfqrwof2kahqlhcvbsxyqrjy/bin/icon
    runjob_filename: icon_runjob.cfg
    compute_queue: normal
    walltime: '07:00:00'
    np_tot: 5
    np_io: 1
    np_restart: 0
    np_prefetch: 1