# Configuration file for the 'icon-twoway-bep-tree-trees-after-surface-for-testing-zurich' case with ICON

workflow: icon-twoway-bep-tree-notrees-after-surface-for-testing-zurich
run_on: cpu
compute_queue: normal
compute_account: em05-0
ntasks_per_node: 128
startdate: 2026-05-23T00:00:00Z
enddate: 2026-06-01T00:00:00Z
# Spin-up-only window (set 2026-08-17), matching icon-standard-zurich: 216h
# = 9 days (23 May - 1 Jun). Full production window is 936h (23 May - 1 Jul);
# ICBC for that whole range is already generated and verified
# (heatwave2026/icbc, 937 files, ALL CHECKS PASSED). To extend: set enddate
# to 2026-07-01T00:00:00Z and restart_step to PT936H (must always equal
# enddate-startdate exactly, or config.py's get_chunk_list() silently drops
# the only chunk - see icon-standard-zurich/config.yaml for the full note).
# restart_step = the whole window: one chunk, no restart chaining, matching
# how these cases are always run.
restart_step: PT216H
lterra_urb: .FALSE.
lurbalb: .FALSE.
lurbahf: .FALSE.

walltime:
    prepare_icon: '00:30:00'
    oem: '00:30:00'
    icon: '01:30:00'

eccodes_dir: /capstor/store/cscs/c2sm/amrs/kdnmez/eccodes_definitions
iconremap_bin: iconremap
iconsub_bin: iconsub
# ICBC now comes from icon_icbc_prep (CDO-based, replaces the old
# iconremap/ncks pipeline) - see /capstor/scratch/cscs/kdnmez/heatwave2026/.
# latbc_copy_path/inicond_filename feed prepare_icon.py's "extras for kutay's
# version" cp step; latbc_filename/dwdfg_filename must match what actually
# lands in cfg.icon_input_icbc after that copy - both point at the
# calendar-dated names (lbc_<date>.nc / ic_<date>.nc), not the DWD
# lead-time names (ilbff.../igfff...), since ICON's <y><m><d><h> templating
# in latbc_filename needs one file per real timestamp.
latbc_filename: lbc_<y><m><d><h>.nc
# Moved off scratch to durable store 2026-08-17: heatwave2026/icbc/ on
# /capstor/scratch is subject to purge, this copy on /capstor/store isn't.
# rsync -H preserved the hard-link structure (ic_<date>.nc/lbc_<date>.nc are
# still hard links to igfff.../ilbff..., not separate copies - matters for
# downstream cp -rf, see icon_icbc_prep/README.md gotcha #13). 1680 files
# now available (23 May - 31 Jul); the broad glob matches all of them, only
# this case's own window (see startdate/enddate above) actually gets used -
# harmless once-off extra copy, not a correctness issue.
latbc_copy_path: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/icbc_input/zurich_small/remapped/lbc/lbc_2026*.nc
inidata_prefix: ic_
inidata_nameformat: '<y><m><d><h>'
inidata_filename_suffix: .nc
inicond_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/icbc_input/zurich_small/remapped/ic/ic_2026052300.nc
output_filename: ICON-NWP-URBANATURE-UNSTRUCTURED
filename_format: <output_filename>_DOM<physdom>_<datetime2>
lateral_boundary_grid_order: lateral_boundary
dwdfg_filename: ic_2026052300.nc

icontools_runjobs:
    - copy_icbc.cfg

# Domain grid/extpar switched to zurich_small (2026-08-17) - the same
# pipeline that produced the ICBC (icon_icbc_prep) targets zurich_small, and
# it's confirmed the identical physical grid as zurich_beptree used before
# (matching uuidOfHGrid for both the dynamics grid and the lateral boundary
# grid), so this is a path-naming update only, not a domain change.
input_files:
    radiation_grid_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_small/zonda_output_zurich_small/data/DOM01/zurich_small_DOM01.parent.nc
    dynamics_grid_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_small/zonda_output_zurich_small/data/DOM01/zurich_small_DOM01.nc
    map_file_latbc: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/map_file_ZH.latbc
    lateral_boundary_grid: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_small/zonda_output_zurich_small/data/DOM01/zurich_small_DOM01_latbc.grid.nc
    lrtm_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/icon-nwp-new/data/rrtmg_lw.nc
    map_file_ana: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/map_file.ana
    chemtracer_xml_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/xml/updated_summer23.xml
    extpar_filename: /capstor/store/cscs/c2sm/amrs/kdnmez/UrbaNature/icon_beptree_run/input/grid_extpar_input/zurich_small/zonda_output_zurich_small/data/DOM01/zurich_small_DOM01_external_parameter.nc

# the right extpar data to use for clcplus is: spatially_varying_extpar_final_output_CLCplus_UrbaNature.nc both for spatially varying and constant cases.

icon:
    binary_file: /capstor/store/cscs/c2sm/amrs/kdnmez/spack/opt/spack/linux-sles15-zen2/gcc-13.3.0/icon-icon-2026.04-dwd-1.9-iixu6iy4vfqrwof2kahqlhcvbsxyqrjy/bin/icon
    runjob_filename: icon_runjob.cfg
    compute_queue: normal
    walltime: '01:30:00'
    np_tot: 5
    np_io: 1
    np_restart: 0
    np_prefetch: 1