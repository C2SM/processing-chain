# Configuration file for the 'icon-art-oem-era5-test' case with ICON-ART-OEM.
#
# Same grid, period, emissions and point sources as icon-art-oem-test, but
#   - initial and lateral boundary conditions from ERA5 and CAMS CO2,
#     fetched by get_icbc_data and remapped by remap_icbc;
#   - tracers.xml generated by prepare_oem from the `tracers` section below;
#   - additional CO2 tracers: a CAMS background and the VPRM biospheric
#     fluxes (gross uptake and respiration);
#   - CH4 as a passive tracer without OH chemistry (which needs Cloud-J
#     photolysis data matching the ICON-ART version). It starts from zero,
#     i.e. TRCH4 holds the enhancement due to the emissions in the domain.
#
# The remapping job runs in the netcdf-tools uenv, whose NCO (>= 5.3.2) can
# vertically interpolate the CAMS data. ERA5 is read without credentials;
# the CAMS data needs an ADS account (~/.cdsapirc).

workflow: icon-art-oem-era5
constraint: gpu
run_on: cpu
compute_queue: normal
nodes: 1
ntasks_per_node: 280
restart_step: PT6H
startdate: 2018-01-01T00:00:00Z
enddate: 2018-01-01T12:00:00Z

# Initial and lateral boundary files written by remap_icbc
inidata_prefix: era5_ini_
inidata_nameformat: '%Y%m%d%H'
inidata_filename_suffix: .nc
latbc_filename: era5_ini_<y><m><d><h>.nc

# Relative to the root of the processing chain
art_input_folder: input/icon-art-oem/ART
ecrad_data_path: /capstor/scratch/cscs/ekoene/icon-nwp-new/externals/ecrad/data # This should become part of the `input` coming with the processing chain

walltime:
    prepare_icon: '00:15:00'
    remap_icbc: '00:30:00'
    icon: '00:30:00'

meteo:
    inc: 3
    fetch_era5: True

chem:
    fetch_cams: True # Requires `~/.cdsapirc` to contain the ADS API url and key

remap_icbc:
    scripts:
        - ICBC/remap_era5.sh
        - ICBC/add_cams_co2.sh
    uenv: netcdf-tools/2025:v1
    view: netcdf

# Written to tracers.xml by prepare_oem, see jobs/tools/generate_tracers_xml.py
tracers:
    # --- CH4 from the OEM emissions (passive, no chemistry)
    TRCH4:
        oem_tscale: 1
        oem_cat: agri,CH4_J,other
        oem_vp: GNFR_A,GNFR_A,GNFR_A
        oem_tp: GNFR_A,GNFR_A,GNFR_A
    # --- Passive tracers for the point sources in pntSrc_example.xml
    testtr: {}
    TRSO2: {}
    # --- CO2: CAMS background (variable CO2 in the IC/LBC files) and VPRM
    TRCO2_BG:
        init_name: CO2
    CO2_GPP:
        oem_ftype: gpp
    CO2_RA:
        oem_ftype: resp
    # --- The VPRM flux (not transported) of each vegetation
    # class, in kg m-2 s-1, on model levels 1 to 8
    EM_CO2_GPP:
        oem_ftype: gpp
    EM_CO2_RA:
        oem_ftype: resp

input_files:
    radiation_grid_filename: ../../input/icon-art-oem/grid/testcase_DOM01.parent.nc
    dynamics_grid_filename: ../../input/icon-art-oem/grid/testcase_DOM01.nc
    extpar_filename: ../../input/icon-art-oem/grid/external_parameter_icon_testcase_DOM01_tiles.nc
    map_file_ana: map_file.ana
    wrapper_filename: icon_wrapper.sh
    pntSrc_xml_filename: ../../input/icon-art-oem/XML/pntSrc_example.xml
    oem_gridded_emissions_nc: ../../input/icon-art-oem/OEM/tno_3cat.nc
    oem_vertical_profiles_nc: ../../input/icon-art-oem/OEM/vertical_profiles.nc
    oem_hourofday_nc: ../../input/icon-art-oem/OEM/hourofday.nc
    oem_dayofweek_nc: ../../input/icon-art-oem/OEM/dayofweek.nc
    oem_monthofyear_nc: ../../input/icon-art-oem/OEM/monthofyear.nc
    oem_vegetation_indices_nc: ../../input/icon-art-oem/OEM/VPRM_indices_testcase_DOM01.nc # This has to become part of the processing chain input data

icon:
    binary_file: ./ext/icon-art/bin/icon
    uenv: icon/26.7:v1
    runjob_filename: icon_runjob.cfg
